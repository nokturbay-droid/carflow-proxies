name: harvest
# Раз в сутки собирает бесплатные прокси с GitHub-списков, проверяет их на сайтах каталога
# (Корея: encar, kbcha; ОАЭ: dubicars, dubizzle; Грузия: myauto) и коммитит результат в proxies/.
on:
  schedule:
    # Дважды в сутки и не в :00 — ровные часы у GitHub перегружены (27.09 запуск на 00:00 стартовал в 04:19).
    - cron: "17 21 * * *"  # 21:17 UTC = 03:17 Бишкек — к таймеру бокса 07:30 список уже свежий
    - cron: "43 9 * * *"   # 09:43 UTC — запасной, если ночной не стартовал
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "requests[socks]"
      # Код 1 = СБОЙ (живых подозрительно мало) — файлы не перезаписаны, запуск красный, GitHub пришлёт письмо.
      - name: Сбор и проверка
        run: python harvest/proxy_harvest.py --out proxies --sources harvest/proxy_sources.txt
      - name: Сохранить результат
        run: |
          git config user.name "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          git add proxies
          git diff --cached --quiet || git commit -m "proxies: $(date -u +%F)"
          git push
      # Выборочная повторная проверка уже сохранённого списка; < 50 % живых — запуск красный.
      - name: Самопроверка
        run: python harvest/proxy_check.py --dir proxies
